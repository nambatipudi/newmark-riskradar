services:
  # Project 1: The .NET Backend
  api:
    build:
      context: ./NewmarkRiskRadar-API
      dockerfile: src/Newmark.RiskRadar.Api/Dockerfile
    container_name: riskradar-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SqliteConnection=Data Source=/app/data/riskradar.db
      - Cors__AllowedOrigins__0=http://localhost:3000
    volumes:
      - sqlite_data:/app/data
    ports:
      - "5000:8080"
    restart: unless-stopped

  # Project 2: The Next.js Frontend
  ui:
    build:
      context: ./NewmarkRiskRadar-UI
      dockerfile: Dockerfile
    container_name: riskradar-ui
    environment:
      # Server-side rendering calls the API over the compose network; the browser uses the same-origin /api rewrite.
      - API_PROXY_TARGET=http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlite_data:
