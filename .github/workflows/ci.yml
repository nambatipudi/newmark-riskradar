name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NewmarkRiskRadar-API

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Newmark.RiskRadar.sln

      - name: Build
        run: dotnet build Newmark.RiskRadar.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Newmark.RiskRadar.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: NewmarkRiskRadar-API/TestResults/**/*.trx
          if-no-files-found: ignore

  ui:
    name: UI (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NewmarkRiskRadar-UI

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NewmarkRiskRadar-UI/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  containers:
    name: Container images
    runs-on: ubuntu-latest
    needs: [api, ui]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only: proves both Dockerfiles work without publishing anything.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./NewmarkRiskRadar-API
          file: ./NewmarkRiskRadar-API/src/Newmark.RiskRadar.Api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: ./NewmarkRiskRadar-UI
          file: ./NewmarkRiskRadar-UI/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
